on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            just \
            nodejs \
            npm
      - name: Checkout repository
        uses: actions/checkout@v7
      # Every recipe in `just ci` runs a tool out of node_modules, so the
      # dependencies have to exist before the gate runs. `npm ci` installs the
      # exact tree in package-lock.json rather than re-resolving ranges.
      - name: Install dependencies
        run: npm ci
      - name: Run CI
        run: just ci

  update-and-deploy:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    needs: ci
    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            just \
            nodejs \
            npm
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install dependencies
        run: npm ci
      # `just build` runs the card generator and then vite, producing ./dist.
      # Without this the deploy step below has nothing to upload.
      - name: Build
        run: just build
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # Wrangler is fetched at run time with npx instead of coming from a
        # pinned flake. The tree is always dirty here because ./dist was built
        # after checkout.
        run: |
          npx --yes wrangler@latest pages deploy ./dist \
            --project-name=${{ forgejo.event.repository.name }} \
            --commit-dirty=true
