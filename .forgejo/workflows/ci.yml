on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Install just from the distro package archive. setup-just authenticated
      # its release lookup with Forgejo's GITHUB_TOKEN and failed with "Bad
      # credentials"; apt avoids the GitHub API entirely.
      - name: Set up Just
        run: |
          apt-get update
          apt-get install -y --no-install-recommends just
      # Every recipe in `just ci` runs a tool out of node_modules, so the
      # dependencies have to exist before the gate runs. `npm ci` installs the
      # exact tree in package-lock.json rather than re-resolving ranges.
      - name: Install dependencies
        run: npm ci
      - name: Run CI
        run: just ci

  update-and-deploy:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Same apt setup as the `ci` job above.
      - name: Set up Just
        run: |
          apt-get update
          apt-get install -y --no-install-recommends just
      - name: Install dependencies
        run: npm ci
      # `just build` runs the card generator and then vite, producing ./dist.
      # Without this the deploy step below has nothing to upload.
      - name: Build
        run: just build
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # Wrangler is fetched at run time with npx instead of coming from a
        # pinned flake. The tree is always dirty here because ./dist was built
        # after checkout.
        run: |
          npx --yes wrangler@latest pages deploy ./dist \
            --project-name=${{ forgejo.event.repository.name }} \
            --commit-dirty=true
